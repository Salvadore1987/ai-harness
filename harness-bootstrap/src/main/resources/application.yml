spring:
  application:
    name: ${HARNESS_APP_NAME:harness}
  main:
    banner-mode: ${HARNESS_BANNER_MODE:off}
    log-startup-info: ${HARNESS_LOG_STARTUP_INFO:false}
    lazy-initialization: ${HARNESS_LAZY_INIT:true}
  config:
    import: optional:file:${HARNESS_HOME:${user.home}/.harness}/config.yml
  ai:
    ollama:
      base-url: ${harness.ollama-base-url}
      init:
        pull-model-strategy: ${HARNESS_PULL_MODEL_STRATEGY:never}
      chat:
        model: ${harness.model}
        num-ctx: ${harness.context.num-ctx}
        temperature: ${HARNESS_TEMPERATURE:0.2}
        keep-alive: ${HARNESS_KEEP_ALIVE:30m}

harness:
  model: ${HARNESS_MODEL:qwen3.5:27b}
  ollama-base-url: ${HARNESS_OLLAMA_BASE_URL:http://localhost:11434}
  home: ${HARNESS_HOME:${user.home}/.harness}
  thinking:
    enabled: ${HARNESS_THINKING_ENABLED:true}
    display: ${HARNESS_THINKING_DISPLAY:stream}
    persist: ${HARNESS_THINKING_PERSIST:false}
  context:
    num-ctx: ${HARNESS_NUM_CTX:65536}
    compact-threshold: ${HARNESS_COMPACT_THRESHOLD:0.8}
    keep-tail-share: ${HARNESS_KEEP_TAIL_SHARE:0.25}
    chars-per-token: ${HARNESS_CHARS_PER_TOKEN:3.5}
  agent:
    max-iterations: ${HARNESS_AGENT_MAX_ITERATIONS:25}
    max-parse-failures: ${HARNESS_AGENT_MAX_PARSE_FAILURES:2}
  tools:
    max-output-chars: ${HARNESS_TOOLS_MAX_OUTPUT_CHARS:8000}
